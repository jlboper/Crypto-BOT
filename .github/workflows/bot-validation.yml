name: Bot update safety checks
on:
  pull_request:
    paths: ['trader/**', 'scripts/**', 'tests/**', 'pyproject.toml', '.github/workflows/bot-validation.yml']
  push:
    branches: [main]
    paths: ['trader/**', 'scripts/**', 'tests/**', 'pyproject.toml', '.github/workflows/bot-validation.yml']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.1
      - run: python scripts/test_offline.py
      - name: Parse Windows supervisor scripts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($path in @('scripts/manager_windows.ps1', 'scripts/refresh_windows_agent.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw "$path : $($parseErrors -join '; ')" }
          }
